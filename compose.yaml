name: mini-notes
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notes
      MYSQL_USER: notes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notes_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:-mini-notes-local-development-secret}
      DATABASE_URL: mysql://notes:${MYSQL_PASSWORD:-notes_local_password}@db:3306/notes?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/console", "about", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${APP_PORT:-80}:80"
      - "127.0.1.1:${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.29.240.0/24}
